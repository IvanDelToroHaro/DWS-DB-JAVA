spring.application.name=cv_alumnos

# Configuración del servidor web embebido Tomcat
server.port=8080

# Conexión JDBC a MySQL (Base de datos: altair)
spring.datasource.url=jdbc:mysql://localhost:3306/cv_alumnos?currentSchema=cv_alumnos
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate para MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true